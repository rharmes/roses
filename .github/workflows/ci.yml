name: CI

# Keep the codebase healthy from the first commit: formatting, linting (with
# warnings denied), and tests must pass on every push and pull request.
on:
  push:
  pull_request:

# Least privilege — CI only needs to read the repository.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run, saving CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # rust-toolchain.toml pins channel = "stable" with the rustfmt + clippy
      # components; install exactly that so CI builds roses identically to a
      # developer's machine. (If the pin ever moves to a fixed version, update
      # the channel here to match — see docs/ci.md.)
      - name: Install the pinned Rust toolchain (stable + rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      # Cache the cargo registry, git index, and target/ directory keyed on the
      # toolchain + Cargo.lock, so green builds don't recompile the world.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Formatting — cargo fmt --check
        run: cargo fmt --all --check

      - name: Lint — cargo clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests — cargo test
        run: cargo test --locked

  # Exercises the Linux keychain path end-to-end against a real Secret Service.
  # The regular `cargo test` above skips it (the round-trip test is `#[ignore]`d
  # and needs a running keyring daemon); here we provision gnome-keyring on the
  # headless runner and run just that test. Kept as a separate job so a keyring
  # hiccup can never block the core lint-and-test checks. See docs/ci.md.
  linux-keychain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      # gnome-keyring provides the Secret Service (org.freedesktop.secrets) that
      # the zbus keyring backend talks to; dbus provides `dbus-run-session`.
      - name: Install gnome-keyring + dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus

      # Run the ignored round-trip test inside a fresh D-Bus session with an
      # unlocked login keyring. `--components=secrets` makes gnome-keyring serve
      # the Secret Service API; the password on stdin creates/unlocks the keyring.
      - name: Keychain round-trip against the Secret Service
        run: |
          rm -f "$HOME/.local/share/keyrings/"* || true
          dbus-run-session -- bash -euo pipefail -c '
            echo -n "roses-ci" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -- --ignored keychain_round_trip_via_secret_service
          '

  # Verifies the static-musl release path builds and links (TASK-43). rusqlite's
  # `bundled` feature compiles SQLite from C, which re-added a C dependency to the
  # otherwise-C-free musl build (TASK-41); this catches a linking regression on
  # every push/PR rather than at release time. x86_64 only for now — aarch64-musl
  # would need a cross C toolchain. Separate/advisory job so a toolchain hiccup
  # can't block the core gate. See docs/ci.md.
  musl-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain (stable) + musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: musl

      # musl-gcc (from musl-tools) compiles rusqlite's bundled sqlite3.c for the
      # musl target — the C dependency this job exists to verify.
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build the static musl release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify the binary is statically linked
        run: |
          bin=target/x86_64-unknown-linux-musl/release/roses
          file "$bin"
          # `file` reports "statically linked" for a self-contained musl binary;
          # fail the job if it isn't (grep -q exits non-zero).
          file "$bin" | grep -q 'statically linked'
