[package]
name = "roses"
version = "0.1.0"
edition = "2024"
description = "A TUI RSS reader, backed by Feedbin."
license = "MIT"
repository = "https://github.com/rharmes/roses"
homepage = "https://github.com/rharmes/roses"
readme = "README.md"

[dependencies]
anyhow = "1.0.103"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = { version = "4.1.2", features = ["apple-native-keyring-store"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
shlex = "2.0.1"
tokio = { version = "1.52.3", default-features = false, features = ["rt", "sync"] }
toml = "1.1.2"
unicode-width = "0.2.2"

[dev-dependencies]
mockito = "1.7.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
